<div class="container-fluid p-0">
  <!-- Carrusel -->
  <div id="carouselExampleFade" class="carousel slide carousel-fade" style="height: 50vh;">
    <div class="carousel-inner h-100">
      <div class="carousel-item active h-100">
        <img src="https://picsum.photos/id/18/2500/1667" class="d-block h-100 w-100 object-fit-cover" alt="...">
      </div>
      <div class="carousel-item h-100">
        <img src="https://picsum.photos/id/15/2500/1667" class="d-block h-100 w-100 object-fit-cover" alt="...">
      </div>
      <div class="carousel-item h-100">
        <img src="https://picsum.photos/id/12/2500/1667" class="d-block h-100 w-100 object-fit-cover" alt="...">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleFade" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- Sección de productos -->
  <div class="container py-5">
    <h2 class="text-center mb-4">sitios populares para vistar</h2>
    
    <div class="row g-4">
      <!-- Producto 1 -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-0 shadow-sm">
          <img src="https://picsum.photos/id/11/2500/1667" class="card-img-top" alt="Producto 1">
          <div class="card-body">
            <h5 class="card-title">Estados Unidos</h5>
 
          </div>
        </div>
      </div>
      
      <!-- Producto 2 -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-0 shadow-sm">
          <img src="https://picsum.photos/id/10/2500/1667" class="card-img-top" alt="Producto 2">
          <div class="card-body">
            <h5 class="card-title">Alemania</h5>
          </div>
        </div>
      </div>
      
      <!-- Producto 3 -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-0 shadow-sm">
          <img src="https://picsum.photos/id/13/2500/1667" class="card-img-top" alt="Producto 3">
          <div class="card-body">
            <h5 class="card-title">Portugal</h5>

          </div>
        </div>
      </div>
      
      <!-- Producto 4 -->
      <div class="col-md-6 col-lg-3">
        <div class="card h-100 border-0 shadow-sm">
          <img src="https://picsum.photos/id/14/2500/1667" class="card-img-top" alt="Producto 4">
          <div class="card-body">
            <h5 class="card-title">Italia</h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Sección de Alumnos (ancho completo debajo de productos) -->
  <div class="container pb-5">
    <div class="row">
      <div class="col-12">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <div>
                <h5 class="card-title d-flex align-items-center mb-0">
                  <mat-icon class="me-2">people</mat-icon>
                  Alumnos
                </h5>
                <p class="mb-0 mt-1">Crear de alumnos</p>
              </div>
              <button mat-button (click)="onNavigate()">
                Crear
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
